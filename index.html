<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Amy Trompeter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark">
  <div class="bg" aria-hidden="true"></div>
  <main class="container">
    <section class="card" role="region" aria-labelledby="name">
      <div class="controls">
        <button id="theme-toggle" class="toggle" type="button" aria-label="Toggle light and dark mode" aria-pressed="false">
          <span class="toggle-icon" aria-hidden="true">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 15.5A7.5 7.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/>
              <path d="M12 2.5V5M12 19V21.5M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M2.5 12H5M19 12h2.5M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </span>
        </button>
      </div>

      <img src="assets/profile.svg" alt="Profile photo" class="avatar" width="120" height="120">
      <h1 id="name" class="name">Amy Trompeter</h1>
      <p class="bio">Designer &amp; Developer — building delightful web experiences.</p>

      <nav class="links" aria-label="Links">
        <a class="btn btn-portfolio" href="https://my-site-test-nine.vercel.app/" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">💼</span>
          <span class="label">Portfolio</span>
        </a>

        <a class="btn btn-linkedin" href="https://www.linkedin.com/in/amy-trompeter-615184156" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">🔗</span>
          <span class="label">LinkedIn</span>
        </a>

        <a class="btn btn-email" href="mailto:amy.trompeter@slalom.com">
          <span class="icon" aria-hidden="true">✉️</span>
          <span class="label">Email</span>
        </a>
      </nav>
      <footer class="footer">Made with love ❤️</footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
