<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Amy Trompeter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark">
  <div class="bg" aria-hidden="true"></div>
  <main class="container">
    <section class="card" role="region" aria-labelledby="name">
      <img src="assets/profile.svg" alt="Profile photo" class="avatar" width="120" height="120">
      <h1 id="name" class="name">Amy Trompeter</h1>
      <p class="bio">Designer &amp; Developer — building delightful web experiences.</p>

      <nav class="links" aria-label="Links">
        <a class="btn btn-portfolio" href="https://my-site-test-nine.vercel.app/" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">💼</span>
          <span class="label">Portfolio</span>
        </a>

        <a class="btn btn-linkedin" href="https://www.linkedin.com/in/amy-trompeter-615184156" target="_blank" rel="noopener noreferrer">
          <span class="icon" aria-hidden="true">🔗</span>
          <span class="label">LinkedIn</span>
        </a>

        <a class="btn btn-email" href="mailto:amy.trompeter@slalom.com">
          <span class="icon" aria-hidden="true">✉️</span>
          <span class="label">Email</span>
        </a>
      </nav>

      <div class="controls">
        <button id="theme-toggle" class="toggle" aria-pressed="false">Light Mode</button>
      </div>

      <footer class="footer">Made with love ❤️</footer>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
